  /* ---------- 合言葉の入力 ---------- */
  // 入力された合言葉を、実際に中継サーバーへ問い合わせて検証する。
  // 軽量なTMDBの/configurationエンドポイントを使う（合言葉が合っていれば200、間違っていれば401が返る）。
  // 中継サーバー自体に到達できない（オフライン等）場合は判定不能として扱う（呼び出し側でフォールバック）。
  function verifyPassphrase(pw){
    var url=PROXY_BASE_URL.replace(/\/$/,"")+"/tmdb/configuration?pw="+encodeURIComponent(pw);
    return fetch(url).then(function(r){
      if(r.status===401) return false;
      return true;
    });
  }

  function promptTmdbKey(cb){
    // 入力欄には現在の合言葉を表示しない（画面を見られただけで漏れないようにするため）。
    // 空欄のままOKを押した場合／間違った合言葉を入力した場合は、いずれも「進めた」ことにはせず再入力を求める。
    // キャンセルを押した場合のみ、後回しにできる（他の操作は続けられる）。
    function ask(){
      var v=window.prompt("合言葉を入力してください。", "");
      if(v===null){ if(cb) cb(); return; }
      v=(v||"").trim();
      if(!v){
        alert("合言葉が入力されていません。もう一度入力してください。\n（今は入力しない場合はキャンセルを押してください）");
        ask();
        return;
      }
      toast("合言葉を確認中…");
      verifyPassphrase(v).then(function(ok){
        if(!ok){
          alert("合言葉が正しくありません。もう一度入力してください。\n（今は入力しない場合はキャンセルを押してください）");
          ask();
          return;
        }
        setTmdbKey(v);
        toast("合言葉を保存しました");
        if(cb) cb();
      }).catch(function(){
        // 中継サーバーに接続できない等、合言葉が正しいか確認できない場合は、
        // ブロックしすぎないようそのまま保存する（後で検索等が失敗すれば401リトライ導線に入る）。
        setTmdbKey(v);
        toast("合言葉を保存しました（確認できませんでした）");
        if(cb) cb();
      });
    }
    ask();
  }

  /* ---------- detail sheet ---------- */
  function findItem(id){ return state.items.filter(function(it){return it.id===id;})[0]; }

  function historyHtml(item){
    var hist=(item.history||[]).slice().reverse().slice(0,6);
    if(!hist.length) return "";
    var h='<div class="hist-wrap"><div class="hist-title">これまでの記録</div>';
    hist.forEach(function(entry){
      var color = entry.status==="want"?"var(--want)":entry.status==="watching"?"var(--watching)":"var(--done)";
      var d=new Date(entry.at);
      var dstr = isNaN(d.getTime()) ? "" : (d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0"));
      h+='<div class="hist-row"><span class="hist-dot" style="background:'+color+'"></span><span class="hist-label">'+STATUS_LABEL[entry.status]+'に変更</span><span class="hist-date">'+dstr+'</span></div>';
    });
    h+='</div>';
    return h;
  }

  function openDetail(id){
    var item=findItem(id);
    if(!item) return;
    var typeLabel=typeLabelOf(item);
    var genres=genreNamesOf(item);
    var h='<div class="grip"></div>'
      + '<div class="prev">'+coverHtml(item)+'<div><div class="t">'+esc(item.title)+'</div>'
      + '<div class="resmeta"><span class="type-badge">'+typeLabel+'</span>'+(item.year?esc(item.year)+"年":"")
      + (genres.length?(' ・ '+esc(genres.join("／"))):'')+'</div>'
      + (item.overview? '<div class="m">'+esc(item.overview)+'</div>' : '')
      + '</div></div>';
    if(item.mediaType==="tv" && item.tmdbId){
      var modeLabel = item.seasonNumber!=null ? esc(item.seasonName||("シーズン"+item.seasonNumber)) : "作品全体";
      h+='<div class="ddr"><span class="ddr-label">登録形式</span><span class="ddr-val">'+modeLabel+'</span><button class="ddr-edit" id="seasonEditBtn">変更</button></div>';
    }
    h+='<h2 style="font-size:14px;margin-top:2px">棚を選ぶ</h2>'
      + shelfChoicesHtml(item.status);
    if(item.status==="want"){
      h+='<div class="detail-star-wrap"><span class="dp-label">優先度</span><div class="detail-stars" id="priStars">'+starsHtml(item.priority||0,false)+'</div></div>';
    } else if(item.status==="done"){
      h+='<div class="detail-star-wrap"><span class="dp-label">評価</span><div class="detail-stars" id="ratStars">'+starsHtml(item.rating||0,true)+'</div></div>';
      var wd=item.watchedAt;
      h+='<div class="ddr"><span class="ddr-label">観た日</span><span class="ddr-val" id="wdVal">'+(wd?esc(wd):"未設定")+'</span><button class="ddr-edit" id="wdEditBtn">編集</button></div>'
        +'<div class="ddr-editbox" id="wdEditBox"><input type="date" id="wdInput" value="'+esc(wd||todayStr())+'"><button class="btn primary sbtn" id="wdSaveBtn">保存</button></div>';
    }
    var memoLabel = item.status==="done" ? "感想・レビュー" : item.status==="watching" ? "メモ（何話まで観たか等）" : "メモ（気になる理由など）";
    h+='<div class="field"><label>'+memoLabel+'</label><textarea id="memoInput" placeholder="自由にメモできます">'+esc(item.memo||"")+'</textarea></div>';
    if(item.tmdbId){
      h+='<div class="cast-wrap"><div class="cast-head"><span class="cast-title">🎭 キャスト</span><button class="cast-refresh" id="castRefreshBtn">更新</button></div><div id="castBody"></div></div>';
      h+='<div class="wp-wrap"><div class="wp-head"><span class="wp-title">📺 配信状況（日本）</span><button class="wp-refresh" id="wpRefreshBtn">更新</button></div><div id="wpBody"></div></div>';
    }
    h+=historyHtml(item);
    h+='<button class="btn danger" id="delBtn">この作品を削除</button>';
    h+='<button class="btn ghost" id="closeDetailBtn">閉じる</button>';
    openSheet(h);
    var seasonEditBtn=document.getElementById("seasonEditBtn");
    if(seasonEditBtn) seasonEditBtn.onclick=function(){ openSeasonEditSheet(item); };
    if(item.tmdbId){
      renderCastSection(item);
      var castRefreshBtn=document.getElementById("castRefreshBtn");
      if(castRefreshBtn) castRefreshBtn.onclick=function(){ item.credits=null; renderCastSection(item); };
      renderWpSection(item);
      var wpRefreshBtn=document.getElementById("wpRefreshBtn");
      if(wpRefreshBtn) wpRefreshBtn.onclick=function(){ item.wp=null; renderWpSection(item); };
    }

    bindShelfChoices(function(status){
      if(status===item.status) return;
      item.status=status; item.updatedAt=nowIso();
      if(status==="done" && !item.watchedAt) item.watchedAt=todayStr();
      pushHistory(item, status);
      save(); render();
      toast(STATUS_LABEL[status]+"に移動しました");
      openDetail(item.id);
    });
    var priStars=document.getElementById("priStars");
    if(priStars){
      Array.prototype.forEach.call(priStars.querySelectorAll(".priority-star"),function(st){
        st.onclick=function(){
          var v=+st.dataset.i;
          item.priority = (item.priority===v) ? 0 : v;
          item.updatedAt=nowIso(); save(); render(); openDetail(item.id);
        };
      });
    }
    var ratStars=document.getElementById("ratStars");
    if(ratStars){
      Array.prototype.forEach.call(ratStars.querySelectorAll(".priority-star"),function(st){
        st.onclick=function(){
          var v=+st.dataset.i;
          item.rating = (item.rating===v) ? 0 : v;
          item.updatedAt=nowIso(); save(); render(); openDetail(item.id);
        };
      });
    }
    var wdEditBtn=document.getElementById("wdEditBtn");
    if(wdEditBtn){
      wdEditBtn.onclick=function(){ document.getElementById("wdEditBox").classList.add("on"); };
      document.getElementById("wdSaveBtn").onclick=function(){
        var v=document.getElementById("wdInput").value;
        item.watchedAt=v||todayStr(); item.updatedAt=nowIso(); save(); render(); openDetail(item.id);
      };
    }
    var memoInput=document.getElementById("memoInput");
    memoInput.addEventListener("input",function(){ item.memo=memoInput.value; item.updatedAt=nowIso(); });
    memoInput.addEventListener("blur",function(){ save(); });
    document.getElementById("delBtn").onclick=function(){
      state.items=state.items.filter(function(x){return x.id!==item.id;});
      save(); render(); closeSheet(); toast("削除しました");
    };
    document.getElementById("closeDetailBtn").onclick=function(){ save(); closeSheet(); };
  }

  /* ---------- monthly graph ---------- */
  function monthDateOf(item){
    var s = item.watchedAt || (item.status==="done" ? item.updatedAt : null) || item.addedAt;
    return s ? new Date(s) : null;
  }
  function monthlyCounts(year){
    var counts=new Array(12).fill(0);
    state.items.forEach(function(it){
      if(it.status!=="done") return;
      var d=monthDateOf(it);
      if(!d || isNaN(d.getTime())) return;
      if(d.getFullYear()===year) counts[d.getMonth()]++;
    });
    return counts;
  }
  function minDoneYear(){
    var years=state.items.filter(function(it){return it.status==="done";}).map(function(it){
      var d=monthDateOf(it); return (d && !isNaN(d.getTime())) ? d.getFullYear() : null;
    }).filter(function(y){return y!==null;});
    if(!years.length) return new Date().getFullYear();
    return Math.min.apply(null, years);
  }
  function monthlyGraphHtml(year){
    var counts=monthlyCounts(year);
    var max=Math.max.apply(null, counts.concat([1]));
    var total=counts.reduce(function(a,b){return a+b;},0);
    var curYear=new Date().getFullYear(), curMonth=new Date().getMonth();
    var minYear=minDoneYear();
    var h='<div class="mo-head"><button class="mo-year-btn" id="moPrev"'+(year<=minYear?" disabled":"")+'>‹</button><span class="mo-year-label">'+year+'年</span><button class="mo-year-btn" id="moNext"'+(year>=curYear?" disabled":"")+'>›</button></div>';
    h+='<div class="mo-graph">';
    for(var m=0;m<12;m++){
      var hp = counts[m] ? Math.max(Math.round(counts[m]/max*100),6) : 2;
      var isCur = (year===curYear && m===curMonth);
      h+='<div class="mo-col"><span class="mo-cnt">'+(counts[m]||"")+'</span><div class="mo-bar-wrap"><div class="mo-bar'+(isCur?" cur":"")+'" style="height:'+hp+'%"></div></div><span class="mo-lbl">'+(m+1)+'</span></div>';
    }
    h+='</div><div class="mo-total">'+year+'年間で '+total+'本</div>';
    return h;
  }
  function bindMonthlyNav(year){
    var prev=document.getElementById("moPrev"), next=document.getElementById("moNext");
    if(prev) prev.onclick=function(){ if(prev.disabled) return; year-=1; document.getElementById("moSection").innerHTML=monthlyGraphHtml(year); bindMonthlyNav(year); };
    if(next) next.onclick=function(){ if(next.disabled) return; year+=1; document.getElementById("moSection").innerHTML=monthlyGraphHtml(year); bindMonthlyNav(year); };
  }

  /* ---------- trend sheet ---------- */
  function computeGenreStats(){
    var counts={};
    state.items.forEach(function(it){
      genreNamesOf(it).forEach(function(name){ counts[name]=(counts[name]||0)+1; });
    });
    var arr=Object.keys(counts).map(function(k){return {name:k,count:counts[k]};});
    arr.sort(function(a,b){return b.count-a.count;});
    return arr.slice(0,8);
  }
  function openTrendSheet(){
    var c=countsByStatus(), t=countsByType();
    var total=state.items.length;
    var stats=computeGenreStats();
    var maxCnt=stats.length?stats[0].count:1;
    var h='<div class="grip"></div><h2>📊 視聴の傾向</h2>'
      + '<div class="sk-summary">'
      +   '<div><span class="sk-big">'+c.want+'</span><span class="sk-cap">見たい</span></div>'
      +   '<div><span class="sk-big">'+c.watching+'</span><span class="sk-cap">観てる</span></div>'
      +   '<div><span class="sk-big">'+c.done+'</span><span class="sk-cap">観た</span></div>'
      + '</div>'
      + '<div class="hero-split" style="margin-bottom:18px">'
      +   '<div class="hero-split-bar" style="background:var(--accent-soft)">'+typeSplitBarHtml(t,total,"var(--accent-soft)")+'</div>'
      +   '<div class="hero-split-label" style="color:var(--muted)">🎬 映画 '+t.movie+' ・ 📺 ドラマ '+t.tv+' ・ 🎨 アニメ '+t.anime+'（登録全体）</div>'
      + '</div>';
    var curYear=new Date().getFullYear();
    h+='<h2 style="font-size:14px">月別の視聴数（観た作品）</h2><div id="moSection">'+monthlyGraphHtml(curYear)+'</div>';
    if(stats.length){
      h+='<h2 style="font-size:14px">ジャンル内訳（登録作品より）</h2><div class="genre-bars">';
      stats.forEach(function(s){
        var w=Math.round(s.count/maxCnt*100);
        h+='<div><div class="gb-head"><span class="gb-name">'+esc(s.name)+'</span><span class="gb-cnt">'+s.count+'件</span></div><div class="gb-track"><div class="gb-fill" style="width:'+w+'%"></div></div></div>';
      });
      h+='</div>';
    } else {
      h+='<div class="keynote">TMDB検索で作品を追加すると、ジャンルの傾向がここに表示されます。</div>';
    }
    h+='<button class="btn ghost" id="trendCloseBtn">閉じる</button>';
    openSheet(h);
    document.getElementById("trendCloseBtn").onclick=closeSheet;
    bindMonthlyNav(curYear);
  }

  /* ---------- export / import ---------- */
  function exportItems(){
    var blob=new Blob([JSON.stringify({v:1, exportedAt:nowIso(), items:state.items},null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    var d=new Date(); var stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
    a.href=url; a.download="cinemaskill_backup_"+stamp+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},2000);
  }
  function importItems(data){
    var incoming=(data&&data.items)||[];
    var existingIds={}; state.items.forEach(function(it){existingIds[it.id]=true;});
    var added=0, skipped=0;
    incoming.forEach(function(it){
      if(!it||!it.id||existingIds[it.id]){ skipped++; return; }
      state.items.push(it); existingIds[it.id]=true; added++;
    });
    save();
    return {added:added, skipped:skipped};
  }

  /* ---------- events ---------- */
  document.getElementById("tabs").addEventListener("click",function(e){
    var t=e.target.closest(".tab"); if(!t) return; gotoTab(t.dataset.status);
  });
  document.getElementById("typeChips").addEventListener("click",function(e){
    var c=e.target.closest(".chip"); if(!c) return;
    state.typeFilter=c.dataset.type;
    Array.prototype.forEach.call(document.querySelectorAll("#typeChips .chip"),function(b){b.classList.toggle("cur",b===c);});
    renderList();
  });
  document.getElementById("search").addEventListener("input",function(e){ state.q=e.target.value; renderList(); });
  document.getElementById("list").addEventListener("click",function(e){
    var starEl=e.target.closest(".priority-star");
    var card=e.target.closest(".card");
    if(!card) return;
    var id=card.dataset.id;
    if(starEl){
      var row=starEl.closest(".priority-row");
      var item=findItem(id);
      var v=+starEl.dataset.i;
      if(row.dataset.role==="priority"){ item.priority=(item.priority===v)?0:v; }
      else { item.rating=(item.rating===v)?0:v; }
      item.updatedAt=nowIso(); save(); renderList();
      return;
    }
    openDetail(id);
  });
  document.getElementById("fab").addEventListener("click",function(){
    this.classList.remove("squash"); void this.offsetWidth; this.classList.add("squash");
    openAddSheet();
  });
  document.getElementById("trendBtn").addEventListener("click",function(){ openTrendSheet(); });
  document.getElementById("favActorsBtn").addEventListener("click",function(){ openFavActorsSheet(); });
  document.getElementById("exportLinkMain").addEventListener("click",function(e){ e.preventDefault(); exportItems(); });
  document.getElementById("importLinkMain").addEventListener("click",function(e){ e.preventDefault(); document.getElementById("importFileMain").click(); });
  document.getElementById("importFileMain").addEventListener("change",function(e){
    var f=e.target.files&&e.target.files[0]; e.target.value="";
    if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      try{ var data=JSON.parse(rd.result); var n=importItems(data); toast(n.added+"件を取り込みました"+(n.skipped?"（重複"+n.skipped+"件はスキップ）":"")); render(); }
      catch(err){ toast("読み込めませんでした（JSON形式をご確認ください）"); }
    };
    rd.onerror=function(){ toast("ファイルを読み込めませんでした"); };
    rd.readAsText(f);
  });

  window.__cinemaskill={ state:state, save:save, render:render, searchTMDB:searchTMDB, makeItem:makeItem, openDetail:openDetail, openAddSheet:openAddSheet, openManualSheet:openManualSheet, openTrendSheet:openTrendSheet, computeGenreStats:computeGenreStats, setTmdbKey:setTmdbKey, tmdbKey:tmdbKey, exportItems:exportItems, importItems:importItems, fetchWatchProviders:fetchWatchProviders, monthlyCounts:monthlyCounts, minDoneYear:minDoneYear, monthlyGraphHtml:monthlyGraphHtml, fetchCredits:fetchCredits, isAnimeItem:isAnimeItem, typeLabelOf:typeLabelOf, countsByType:countsByType, fetchPersonCredits:fetchPersonCredits, openPersonSheet:openPersonSheet, romajiToKatakana:romajiToKatakana, displayName:displayName, isAlphabetName:isAlphabetName, fetchTvSeasons:fetchTvSeasons, makeSeasonItem:makeSeasonItem, openPreview:openPreview, openAddModeChoice:openAddModeChoice, openSeasonList:openSeasonList, openSeasonBatchShelfPick:openSeasonBatchShelfPick, katakanaToHiragana:katakanaToHiragana, searchReadingKey:searchReadingKey, titleMatchesQuery:titleMatchesQuery, visibleItems:visibleItems, showInfoOf:showInfoOf, openSeasonEditSheet:openSeasonEditSheet, applySeasonChange:applySeasonChange, searchTMDBPerson:searchTMDBPerson, openFavActorsSheet:openFavActorsSheet, isFavActor:isFavActor, addFavActor:addFavActor, removeFavActor:removeFavActor, creditsIsUsable:creditsIsUsable, renderCastSection:renderCastSection, updateFavActorsBadge:updateFavActorsBadge, promptTmdbKey:promptTmdbKey, verifyPassphrase:verifyPassphrase };

  load();
  render();
  // 合言葉が未設定の状態でリンクを開いた場合は、その場で入力を促す
  // （身内向けの初回セットアップをスムーズにするため。キャンセルしても他の操作は続けられる）
  if(!tmdbKey()){ promptTmdbKey(); }
})();
</script>
